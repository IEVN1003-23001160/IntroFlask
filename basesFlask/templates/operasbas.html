{% extends "layout.html" %}

{% block container %}

<form action="/operasbas" method="POST">

    <div class="mb-3">
        <label for="n1" class="form-label">Numero 1:</label>
        <input type="number" step="any" class="form-control"
               id="n1" name="n1" value="{{ n1 }}" required>
    </div>

    <div class="mb-3">
        <label for="n2" class="form-label">Numero 2:</label>
        <input type="number" step="any" class="form-control"
               id="n2" name="n2" value="{{ n2 }}" required>
    </div>

    <label class="form-label">Seleccione la operación:</label>

    <div class="form-check">
        <input class="form-check-input" type="radio"
               name="operacion" value="sumar"
               {% if operacion == 'sumar' or operacion == '' %}checked{% endif %}>
        <label class="form-check-label">Sumar</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio"
               name="operacion" value="restar"
               {% if operacion == 'restar' %}checked{% endif %}>
        <label class="form-check-label">Restar</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio"
               name="operacion" value="multiplicar"
               {% if operacion == 'multiplicar' %}checked{% endif %}>
        <label class="form-check-label">Multiplicar</label>
    </div>

    <br>

    <button type="submit" class="btn btn-primary">Calcular</button>

</form>

<h2>Resultado: {{ "%.2f"|format(res) }}</h2>

{% endblock %}
